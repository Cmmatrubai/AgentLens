<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AgentLens</title>
  <desc id="desc">AgentLens wordmark with an execution trajectory motif and the phrase Evidence for how coding agents work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090b"/>
      <stop offset="0.55" stop-color="#0b1014"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72d7e6"/>
      <stop offset="0.55" stop-color="#8bc8d2"/>
      <stop offset="1" stop-color="#b9a7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#72d7e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#72d7e6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a8b3ba" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="318" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="248" cy="151" rx="210" ry="210" fill="url(#glow)"/>
    <ellipse cx="1050" cy="250" rx="260" ry="180" fill="#9f8cff" opacity="0.035"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#7f929d" stroke-opacity="0.18"/>

  <g transform="translate(82 78)">
    <path d="M20 111C34 83 44 58 68 61c22 3 26 29 48 26 25-4 28-48 53-51 22-3 35 22 58 11" fill="none" stroke="#35434b" stroke-width="2"/>
    <path d="M20 111C34 83 44 58 68 61c22 3 26 29 48 26 25-4 28-48 53-51" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="111" r="7" fill="#0b1014" stroke="#72d7e6" stroke-width="2"/>
    <circle cx="68" cy="61" r="8" fill="#0b1014" stroke="#72d7e6" stroke-width="2"/>
    <circle cx="116" cy="87" r="7" fill="#0b1014" stroke="#e7b86f" stroke-width="2"/>
    <circle cx="169" cy="36" r="9" fill="#0b1014" stroke="#b9a7ff" stroke-width="2"/>
    <circle cx="227" cy="47" r="7" fill="#0b1014" stroke="#e0a08b" stroke-width="2"/>
    <circle cx="68" cy="61" r="19" fill="#72d7e6" opacity="0.12" filter="url(#soft-glow)"/>
    <circle cx="169" cy="36" r="22" fill="#b9a7ff" opacity="0.11" filter="url(#soft-glow)"/>
  </g>

  <g transform="translate(390 92)">
    <text x="0" y="68" fill="#f2f5f6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="650" letter-spacing="-3">AgentLens</text>
    <text x="4" y="112" fill="#8e9ba3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="2.8">EVIDENCE FOR HOW CODING AGENTS WORK</text>
    <line x1="4" y1="140" x2="666" y2="140" stroke="#80909a" stroke-opacity="0.18"/>
    <g transform="translate(4 165)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">
      <circle cx="4" cy="-4" r="3" fill="#72d7e6"/><text x="16" y="0" fill="#718089">OBSERVED</text>
      <circle cx="132" cy="-4" r="3" fill="#e7b86f"/><text x="144" y="0" fill="#718089">DERIVED</text>
      <circle cx="248" cy="-4" r="3" fill="#b9a7ff"/><text x="260" y="0" fill="#718089">GIT</text>
      <circle cx="325" cy="-4" r="3" fill="#a8b3ba"/><text x="337" y="0" fill="#718089">RECORDER</text>
      <circle cx="467" cy="-4" r="3" fill="#e0a08b"/><text x="479" y="0" fill="#718089">HUMAN</text>
    </g>
  </g>
</svg>
